<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - Feria Digital</title>
    <link rel="icon" href="/web/assets/logo.png" />
    <link rel="stylesheet" href="/web/css/global.css">
    <link rel="stylesheet" href="/web/css/login.css" />
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/web/js/notificaciones.js"></script>
    <style>
      .email-icon {
        font-size: 3.5rem;
        margin-bottom: 1rem;
        display: block;
        animation: pulse 2s infinite;
      }
      .email-badge {
        background-color: rgba(59, 130, 246, 0.12);
        color: var(--color-dark-blue);
        padding: 0.6rem 1.2rem;
        border-radius: 20px;
        font-weight: 600;
        word-break: break-all;
        display: inline-block;
        margin: 1rem 0;
        font-size: 1.05rem;
      }
      .success-description {
        color: var(--color-text-light);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 1.2rem;
      }
      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.08); }
        100% { transform: scale(1); }
      }
    </style>
</head>
<body>

<div class="login-container">
    <img src="/web/assets/logo.png" alt="Logo Feria Digital" class="login-logo" />

    <!-- VISTA 1: Formulario de Registro -->
    <div id="registerView">
        <h2>Registrarse</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Tu nombre" required />
            </div>

            <div class="form-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" placeholder="Tu apellido" required />
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="usuario@ejemplo.com" required />
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="********" required />
            </div>

            <div class="form-group">
                <label for="confirmPassword">Verifique su contraseña</label>
                <input type="password" id="confirmPassword" placeholder="********" required />
            </div>
            <button type="submit">Registrarse</button>

            <div class="footer-text">
                ¿Ya tienes cuenta? <a href="/web/login.html">Inicia sesión</a>
            </div>
        </form>
    </div>

    <!-- VISTA 2: Pantalla de Verificación de Correo Enviado -->
    <div id="successView" style="display: none;">
        <span class="email-icon">📩</span>
        <h2>¡Casi listo! Activa tu cuenta</h2>
        <p class="success-description">
            Hemos enviado un enlace de activación al correo:
        </p>
        <div class="email-badge" id="sentEmailDisplay">usuario@ejemplo.com</div>
        <p class="success-description">
            Por favor, abre tu bandeja de entrada (o carpeta de spam) y haz clic en el enlace para activar tu cuenta antes de iniciar sesión.
        </p>
        <a href="/web/login.html" style="text-decoration: none;">
            <button type="button">Ir a Iniciar Sesión</button>
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script defer src="/web/js/registro.js"></script>
</body>
</html>
