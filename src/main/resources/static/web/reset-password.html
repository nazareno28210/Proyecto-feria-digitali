<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar contraseña - Feria Digital</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Toastify CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  
  <!-- Estilos base -->
  <link rel="stylesheet" href="/web/css/global.css">
  <link rel="stylesheet" href="/web/css/login.css">
  
  <style>
    /* Estilos adicionales para reset-password */
    .lock-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      display: block;
      padding: 1rem;
      background: linear-gradient(135deg, var(--color-light-accent) 0%, var(--color-medium-blue) 100%);
      border-radius: 50%;
      box-shadow: 0 8px 20px rgba(34, 197, 94, 0.3);
    }
    
    .lock-icon svg {
      width: 100%;
      height: 100%;
      fill: white;
    }
    
    .password-requirements {
      text-align: left;
      margin: 1rem 0;
      padding: 1rem;
      background: #f0fdf4;
      border-radius: 8px;
      border-left: 3px solid var(--color-medium-blue);
    }
    
    .password-requirements p {
      font-size: 0.85rem;
      color: var(--color-text-light);
      margin: 0 0 0.5rem 0;
      font-weight: 500;
    }
    
    .password-requirements ul {
      margin: 0;
      padding-left: 1.2rem;
      font-size: 0.8rem;
      color: var(--color-text-light);
    }
    
    .password-requirements li {
      margin-bottom: 0.25rem;
    }
    
    #mensaje {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.9rem;
      display: none;
    }
    
    #mensaje.show {
      display: block;
    }
    
    #mensaje.success {
      background: #dcfce7;
      color: #16a34a;
      border: 1px solid #86efac;
    }
    
    #mensaje.error {
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fca5a5;
    }
    
    .back-to-login {
      margin-top: 1.5rem;
      font-size: 0.9rem;
    }
    
    .back-to-login a {
      color: var(--color-medium-blue);
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .back-to-login a:hover {
      text-decoration: underline;
    }
    
    .btn-loading {
      display: none;
    }
    
    button.loading .btn-text {
      display: none;
    }
    
    button.loading .btn-loading {
      display: inline;
    }
    
    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="login-container">
  <!-- Icono de candado -->
  <div class="lock-icon">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M12 1C8.676 1 6 3.676 6 7v2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V11c0-1.1-.9-2-2-2h-2V7c0-3.324-2.676-6-6-6zm0 2c2.276 0 4 1.724 4 4v2H8V7c0-2.276 1.724-4 4-4zm0 10c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z"/>
    </svg>
  </div>
  
  <h2>Nueva Contrasena</h2>
  
  <p style="color: var(--color-text-light); margin-bottom: 1.5rem; font-size: 0.95rem;">
    Ingresa tu nueva contrasena para restablecer el acceso a tu cuenta.
  </p>
  
  <div class="form-group">
    <label for="password">Nueva contrasena</label>
    <input 
      type="password" 
      id="password" 
      placeholder="Ingresa tu nueva contrasena"
      required
    >
  </div>
  
  <div class="form-group">
    <label for="confirmPassword">Confirmar contrasena</label>
    <input 
      type="password" 
      id="confirmPassword" 
      placeholder="Confirma tu nueva contrasena"
      required
    >
  </div>
  
  <div class="password-requirements">
    <p>Tu contrasena debe tener:</p>
    <ul>
      <li>Al menos 8 caracteres</li>
      <li>Una letra mayuscula</li>
      <li>Un numero</li>
    </ul>
  </div>
  
  <div id="mensaje"></div>
  
  <button type="button" id="submitBtn" onclick="cambiarPassword()">
    <span class="btn-text">Cambiar Contrasena</span>
    <span class="btn-loading">Procesando...</span>
  </button>
  
  <div class="back-to-login">
    <a href="/web/login.html">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Volver al inicio de sesion
    </a>
  </div>
</div>

<!-- Toastify JS -->
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

<!-- Logica de reset password -->
<script src="/web/js/reset-password.js"></script>

</body>
</html>
