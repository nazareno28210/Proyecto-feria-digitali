<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar Contraseña - Feria Digital</title>
  <link rel="icon" href="/web/assets/logo.png" />
  <link rel="stylesheet" href="/web/css/global.css">
  <link rel="stylesheet" href="/web/css/login.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</head>

<body>

<div class="login-container">
  <img src="/web/assets/logo.png" alt="Logo Feria Digital" class="login-logo" />

  <!-- VISTA 1: Solicitar enlace (Sin token) -->
  <div id="requestView">
    <h2>Recuperar Contraseña</h2>
    <p style="color: var(--color-text-light); margin-bottom: 1.5rem; font-size: 0.95rem;">
      Ingresa tu correo electrónico registrado y te enviaremos un enlace para restablecer tu contraseña.
    </p>
    <form id="requestResetForm">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="usuario@ejemplo.com" required />
      </div>
      <button type="submit">Enviar enlace</button>
      <div class="footer-text">
        ¿Recordaste tu contraseña? <a href="/web/login.html">Inicia sesión</a>
      </div>
    </form>
  </div>

  <!-- VISTA 2: Cambiar contraseña (Con token) -->
  <div id="resetView" style="display: none;">
    <h2>Nueva Contraseña</h2>
    <p style="color: var(--color-text-light); margin-bottom: 1.5rem; font-size: 0.95rem;">
      Ingresa tu nueva contraseña para actualizar el acceso a tu cuenta.
    </p>
    <form id="resetPasswordForm">
      <div class="form-group">
        <label for="password">Nueva contraseña</label>
        <input type="password" id="password" placeholder="********" required />
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirmar nueva contraseña</label>
        <input type="password" id="confirmPassword" placeholder="********" required />
      </div>
      <button type="submit">Cambiar contraseña</button>
      <div class="footer-text">
        <a href="/web/login.html">Volver al inicio de sesión</a>
      </div>
    </form>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script defer src="/web/js/reset-password.js"></script>
</body>
</html>
