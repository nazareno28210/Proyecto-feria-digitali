<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feria Digital - Recuperar Contraseña</title>
  <link rel="icon" href="/web/assets/logo.png" />
  <link rel="stylesheet" href="/web/css/global.css">
  <link rel="stylesheet" href="/web/css/login.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</head>

<body>

<div class="login-container">
  
  <img src="/web/assets/logo.png" alt="Logo Feria Digital" class="login-logo" />

  <h2>Recuperar Contraseña</h2>
  
  <p style="color: var(--color-text-light); margin-bottom: 1.5rem; font-size: 0.95rem;">
    Ingresa tu correo electronico y te enviaremos un enlace para restablecer tu contraseña.
  </p>

  <form id="forgotPasswordForm">
    <div class="form-group">
      <label for="email">Correo electronico</label>
      <input type="email" id="email" placeholder="usuario@ejemplo.com" required />
    </div>

    <button type="submit" id="submitBtn">
      <span id="btnText">Enviar enlace de recuperacion</span>
      <span id="btnLoading" style="display: none;">Enviando...</span>
    </button>

    <div class="footer-text">
      <a href="/web/login.html">Volver al inicio de sesion</a>
    </div>
  </form>
</div>

<script src="/web/js/forgot-password.js"></script>
</body>
</html>
